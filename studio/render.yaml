# Render blueprint for the Studio backend.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Render reads this file and provisions the service; no manual config needed.
#
# Afterwards, point the front end at the service URL:
#   gh variable set VITE_API_BASE --repo <owner>/<repo> --body "https://<service>.onrender.com"

services:
  - type: web
    name: afrorestream-studio-api
    runtime: docker
    rootDir: studio
    dockerfilePath: server/Dockerfile
    dockerContext: .
    plan: free             # see the free-tier limits noted below
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Keep the database on the mounted disk. Without this it lands on the
      # container filesystem and every redeploy silently wipes users,
      # destinations and stream keys.
      # No persistent disk on the free plan, so SQLite lives on the container
      # filesystem and resets on redeploy. Set DATABASE_URL to a hosted database
      # (see README) when you want state to survive.
      - key: DATABASE_PATH
        value: /tmp/studio.db
      - key: PORT
        value: 4000
      - key: RECORDINGS_PATH
        value: /tmp/recordings
      # Origins allowed to call the API. Set to your Pages URL.
      - key: CORS_ORIGIN
        sync: false
      # Optional TURN for guests behind strict NAT.
      - key: TURN_URL
        sync: false
      - key: TURN_USER
        sync: false
      - key: TURN_PASS
        sync: false
