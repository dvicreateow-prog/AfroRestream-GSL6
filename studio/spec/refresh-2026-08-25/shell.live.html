    <style>
      :root {
        --card-height: 60px;
        --card-width: 60px;
      }

      @property --rotate {
        syntax: '<angle>';
        initial-value: 132deg;
        inherits: false;
      }

      .loadingScreenBackground {
        position: fixed;
        width: 100vw;
        height: 100vh;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        /*
          When loading screen is shown, we want to show background
          right under it, so we need to set z-index to 20000
        */
        z-index: 20000;
        /* Changing this one? Don't forget to change `background` theme token */
        background-color: #1a1a1a;
      }

      .loadingScreenBackground.positionBottom::after {
        opacity: 1 !important;
        transition: opacity 300ms linear;
      }

      .loadingScreenBackground.positionBottom {
        /*
          When loading screen is hidden, we want to show background
          underneath content for pages
        */
        z-index: -1;
      }

      .loadingScreen {
        position: fixed;
        width: 100vw;
        height: 100vh;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex: 1 1;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 20000;
        opacity: 1;
        transition: opacity 200ms ease;

        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
      }

      .loadingScreen.hidden {
        pointer-events: none;
        opacity: 0;
      }

      .card-text {
        position: relative;
        z-index: 10;
        transform: scale(0.8);
        top: 4px;
      }

      .restream-text-wrapper {
        margin-top: 20px;
        text-align: center;
      }

      .restream-text {
        /* This is a `color-white-thick` theme token */
        color: rgba(255, 255, 255, 0.8);
        font-size: 18px;
        line-height: 24px;
        font-weight: 400;
        font-family:
          system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif,
          'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
      }

      .restream-text-dots::after {
        content: '';
        position: absolute;
        animation: Dots 2s cubic-bezier(0, 0.39, 1, 0.68) infinite;
      }

      .card {
        color: #fff;
        background: #000000;
        width: var(--card-width);
        height: var(--card-height);
        position: relative;
        justify-content: center;
        align-items: center;
        text-align: center;
        display: flex;
        padding: 12px 16px;
        border-radius: 50%;
        box-sizing: border-box;
        font-family: arial, sans-serif;
        font-size: 34px;
        font-weight: bold;
        margin: 0 auto;
      }

      .card::before {
        content: '';
        width: calc(var(--card-width) + 8px);
        height: calc(var(--card-height) + 8px);
        border-radius: 50%;
        position: absolute;
        z-index: -1;
        top: -4px;
        left: -4px;
      }

      .card {
        transition: all 1s;
        background: rgba(0, 0, 0, 0.7);
      }

      .card:before {
        background-image: linear-gradient(
          var(--rotate),
          #444444,
          #2a2a2a 43%,
          #444444
        );
        animation: spin 1.5s linear infinite;
      }

      @keyframes spin {
        0% {
          --rotate: 0deg;
        }
        100% {
          --rotate: 360deg;
        }
      }

      @keyframes Dots {
        0% {
          content: '';
        }

        33% {
          content: '.';
        }

        66% {
          content: '..';
        }

        100% {
          content: '...';
        }
      }
    </style>

    <main id="root"></main>

    <script>
      var url = new URL(location.href)
      var isPlaylist =
        url.searchParams.has('playlist') ||
        url.pathname.startsWith('/playlist') ||
        url.pathname.startsWith('/start-playlist')

      // Webinar pages (viewer and preview) should show only the loader,
      // without any text
      var isWebinar = /^\/webinar\/(preview\/)?[^/]+\/?$/.test(url.pathname)

      if (isWebinar) {
        const loadingScreenTextWrapper = document.querySelector(
          '.restream-text-wrapper',
        )
        if (loadingScreenTextWrapper) {
          loadingScreenTextWrapper.style.display = 'none'
        }
      }

      if (isPlaylist) {
        const loadingScreenText = document.querySelector('.restream-text')
        animateTextRecursively(loadingScreenText, [
          'Setting the stage for your playlist',
          'Getting the videos ready',
          'Putting everything together',
        ])
      }

      function animateTextRecursively(element, texts) {
        if (!element || !texts || texts.length === 0) {
          return
        }

        const text = texts.shift()

        if (text && element) {
          element.innerText = text

          if (texts.length > 0) {
            setTimeout(() => {
              animateTextRecursively(element, texts)
            }, 2000)
          }
        }
      }
    </script>
